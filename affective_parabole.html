</style><h1>Ćwiczenie tolerancji afektywnej</h1><svg viewBox="0 0 1200 760" aria-label="Walencja poziomo, intensywność pionowo"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" style="stroke-width:.4;opacity:.16"/></pattern></defs><rect x="100" y="70" width="1000" height="560" fill="url(#grid)"/><path d="M100 55V630H1120 M94 66L100 55L106 66 M1109 624L1120 630L1109 636"/><path d="M65 40L51 61H62L57 80L73 55H62Z"/><g transform="translate(100 675)"><circle r="17"/><path d="M-7-4V-1M7-4V-1M-8 9Q0-1 8 9"/></g><g transform="translate(1100 675)"><circle r="17"/><path d="M-7-4V-1M7-4V-1M-8 3Q0 13 8 3"/></g><path id="curve"/><g id="handle" tabindex="0" role="slider" aria-label="Głębokość paraboli" aria-valuemin="300" aria-valuemax="420" aria-valuenow="360"><rect x="565" y="550" width="70" height="60" fill="transparent"/><path d="M600 551V581M595 556L600 551L605 556M595 576L600 581L605 576" opacity=".4"/><path d="M587 587H613" style="stroke-width:6;stroke-linecap:round;opacity:.6"/></g><g id="ball"><circle r="29" style="fill:#eee7d5"/><circle r="24" opacity=".3"/><path id="mark" d="M-16-12Q-22 0-16 12" opacity=".6"/></g></svg><div class="controls"><input id="position" aria-label="Położenie kulki" type="range" min="-500" max="500" step=".1" value="-325"><label class="gravity-control" title="Grawitacja: od zatrzymania do naturalnego ruchu"><svg viewBox="0 0 24 28" aria-hidden="true"><circle cx="12" cy="5" r="3"/><path d="M12 12V24M8 20L12 24L16 20"/></svg><span aria-hidden="true">0</span><input id="gravity" aria-label="Siła grawitacji. Zero zatrzymuje kulkę, maksimum oznacza naturalny ruch." type="range" min="0" max="100" step="1" value="100"><span aria-hidden="true">1</span></label></div><script>
const svg=document.querySelector('svg'),curve=document.querySelector('#curve'),ball=document.querySelector('#ball'),slider=document.querySelector('#position'),handle=document.querySelector('#handle');const gravityControl=document.querySelector('#gravity');let gravity=1;

let x=-325,v=0,d=360,held=false,drag=null,last;function p(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}function draw(){let s=2*d*x/250000,n=Math.hypot(1,s);ball.setAttribute('transform',`translate(${600+x-29*s/n} ${560-d*(x/500)**2-29/n})`);document.querySelector('#mark').setAttribute('transform',`rotate(${x/29*180/Math.PI})`);slider.value=x}function shape(){curve.setAttribute('d',`M100 ${560-d}Q600 ${560+d} 1100 ${560-d}`);handle.setAttribute('aria-valuenow',d);draw()}slider.onpointerdown=e=>{held=true;v=0;slider.setPointerCapture(e.pointerId)};slider.oninput=()=>{x=+slider.value;v=0;draw()};slider.onpointerup=slider.onpointercancel=slider.onlostpointercapture=()=>held=false;slider.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key)){held=true;v=0}};slider.onkeyup=slider.onblur=()=>held=false;handle.onpointerdown=e=>{drag={y:p(e).y,d};handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(drag){d=Math.max(300,Math.min(420,drag.d+drag.y-p(e).y));shape()}};handle.onpointerup=handle.onpointercancel=handle.onlostpointercapture=()=>drag=null;handle.onkeydown=e=>{if(['ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();d=e.key==='Home'?300:e.key==='End'?420:Math.max(300,Math.min(420,d+(e.key==='ArrowUp'?6:-6)));shape()}};let bd=false;ball.onpointerdown=e=>{held=bd=true;v=0;ball.setPointerCapture(e.pointerId)};ball.onpointermove=e=>{if(bd){x=Math.max(-500,Math.min(500,p(e).x-600));draw()}};ball.onpointerup=ball.onpointercancel=ball.onlostpointercapture=()=>{held=bd=false};window.onblur=()=>{held=bd=false;drag=null};function frame(t){let dt=last===undefined?0:Math.min(.05,(t-last)/1000);last=t;if(!held&&gravity>0){let steps=Math.max(1,Math.ceil(dt/.004)),h=dt/steps;for(let i=0;i<steps;i++){let s=2*d*x/250000;v+=(-(760*gravity*gravity*s/1.4+s*2*d/250000*v*v)/(1+s*s)-.19*gravity*v)*h;x+=v*h;if(Math.abs(x)>500){x=Math.sign(x)*500;v*= -.45}
